<div class="card">
    <div class="card-header">
        <h2>Metas Financeiras</h2>
        <button class="btn btn-primary" id="btn-nova-meta"><i class="pi pi-plus"></i> Nova Meta</button>
    </div>
    <div id="metas-body"></div>
</div>

<div class="modal-overlay hidden" id="modal-meta">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-meta-title">Nova Meta</h3>
            <button class="btn btn-outline" id="modal-meta-close"><i class="pi pi-times"></i></button>
        </div>
        <form id="form-meta">
            <input type="hidden" id="meta-id" />
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="meta-descricao" required />
            </div>
            <div class="form-group">
                <label>Valor Alvo</label>
                <input type="number" step="0.01" id="meta-valorAlvo" required />
            </div>
            <div class="form-group">
                <label>Valor Atual</label>
                <input type="number" step="0.01" id="meta-valorAtual" value="0" />
            </div>
            <div class="form-group">
                <label>Data Limite</label>
                <input type="date" id="meta-dataLimite" />
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="modal-meta-cancel">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<!-- Templates -->
<template id="tpl-metas-vazio">
    <div class="empty-state">
        <i class="pi pi-flag"></i>
        <p>Nenhuma meta cadastrada</p>
    </div>
</template>

<template id="tpl-metas-tabela">
    <div class="table-container">
        <table>
            <thead>
                <tr><th>Descrição</th><th>Progresso</th><th>Valor Alvo</th><th>Data Limite</th><th></th></tr>
            </thead>
            <tbody id="metas-tbody"></tbody>
        </table>
    </div>
</template>

<template id="tpl-metas-linha">
    <tr>
        <td data-campo="descricao"></td>
        <td data-campo="progresso" style="min-width:150px">
            <div class="progress-bar">
                <div class="fill" data-campo="fill"></div>
            </div>
            <small data-campo="progresso-texto"></small>
        </td>
        <td data-campo="valorAlvo"></td>
        <td data-campo="dataLimite"></td>
        <td data-campo="acoes"></td>
    </tr>
</template>
