<div class="card">
    <div class="card-header">
        <h2>Transações</h2>
        <button class="btn btn-primary" id="btn-nova-transacao">
            <i class="pi pi-plus"></i> Nova Transação
        </button>
    </div>

    <div id="transacoes-body"></div>
    <div class="pagination" id="transacoes-pagination"></div>
</div>

<div class="modal-overlay hidden" id="modal-transacao">
    <div class="modal">
        <div class="modal-header">
            <h3>Nova Transação</h3>
            <button class="btn btn-outline" id="modal-transacao-close">
                <i class="pi pi-times"></i>
            </button>
        </div>
        
        <form id="form-transacao">
            <div class="form-group">
                <label>Descrição</label>
                <input 
                    type="text" 
                    id="transacao-descricao" 
                    required 
                />
            </div>

            <div class="form-group">
                <label>Valor</label>
                <input 
                    type="number" 
                    step="0.01" 
                    id="transacao-valor" 
                    required 
                />
                <div class="currency-converter" id="currency-converter">
                    <span>Converter para:</span>
                    <select id="converter-moeda">
                        <option value="USD">🇺🇸 USD</option>
                        <option value="EUR">🇪🇺 EUR</option>
                        <option value="GBP">🇬🇧 GBP</option>
                        <option value="ARS">🇦🇷 ARS</option>
                        <option value="JPY">🇯🇵 JPY</option>
                        <option value="BRL">🇧🇷 BRL</option>
                    </select>
                    <span class="converted-value" id="converted-value">—</span>
                </div>
            </div>

            <div class="form-group">
                <label>Tipo</label>
                <select id="transacao-tipo">
                    <option value="DESPESA">Despesa</option>
                    <option value="RECEITA">Receita</option>
                </select>
            </div>

            <div class="form-group">
                <label>Data</label>
                <div class="custom-datepicker" id="datepicker-wrapper">
                    <input 
                        type="text" 
                        id="transacao-data-display" 
                        class="datepicker-input" 
                        placeholder="Selecione a data" 
                        readonly 
                        required 
                    />
                    <input 
                        type="hidden" 
                        id="transacao-data" 
                    />
                    <div class="datepicker-dropdown" id="datepicker-dropdown">
                        <div class="datepicker-header">
                            <button type="button" id="dp-prev">
                                <i class="pi pi-chevron-left"></i>
                            </button>
                            <span id="dp-month-year"></span>
                            <button type="button" id="dp-next">
                                <i class="pi pi-chevron-right"></i>
                            </button>
                        </div>
                        <div class="datepicker-weekdays">
                            <span>Dom</span>
                            <span>Seg</span>
                            <span>Ter</span>
                            <span>Qua</span>
                            <span>Qui</span>
                            <span>Sex</span>
                            <span>Sáb</span>
                        </div>
                        <div class="datepicker-days" id="dp-days"></div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Categoria</label>
                <select id="transacao-categoria">
                    <option value="">Selecione...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Conta</label>
                <select id="transacao-conta">
                    <option value="">Selecione...</option>
                </select>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="modal-transacao-cancel">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>
