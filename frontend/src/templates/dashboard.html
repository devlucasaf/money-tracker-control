<h2 class="page-title">Dashboard</h2>

<div class="summary-grid">
    <div class="summary-card">
        <div class="label">Saldo Total</div>
        <div class="value" id="dash-saldo">R$ 0,00</div>
    </div>
    <div class="summary-card">
        <div class="label">Receitas do Mês</div>
        <div class="value positive" id="dash-receitas">R$ 0,00</div>
    </div>
    <div class="summary-card">
        <div class="label">Despesas do Mês</div>
        <div class="value negative" id="dash-despesas">R$ 0,00</div>
    </div>
    <div class="summary-card">
        <div class="label">Economia do Mês</div>
        <div class="value" id="dash-economia">R$ 0,00</div>
    </div>
</div>

<div class="dashboard-grid">
    <div class="card">
        <div class="card-header">
            <h2>Despesas por Categoria</h2>
        </div>
        <div class="chart-container" id="dash-chart-container">
            <canvas id="dash-pie-chart" width="220" height="220"></canvas>
            <div class="chart-legend" id="dash-chart-legend"></div>
        </div>
    </div>
    <div class="card">
        <div class="card-header">
            <h2>Últimas Transações</h2>
        </div>
        <div id="dash-transacoes-body"></div>
    </div>
</div>

<!-- Templates -->
<template id="tpl-dash-vazio-transacoes">
    <div class="empty-state">
        <i class="pi pi-inbox"></i>
        <p>Nenhuma transação recente</p>
    </div>
</template>

<template id="tpl-dash-vazio-grafico">
    <div class="empty-state">
        <i class="pi pi-chart-pie"></i>
        <p>Sem despesas este mês</p>
    </div>
</template>

<template id="tpl-dash-tabela-transacoes">
    <div class="table-container">
        <table>
            <thead>
                <tr><th>Descrição</th><th>Valor</th><th>Tipo</th><th>Data</th></tr>
            </thead>
            <tbody id="dash-transacoes-tbody"></tbody>
        </table>
    </div>
</template>

<template id="tpl-dash-transacao-linha">
    <tr>
        <td data-campo="descricao"></td>
        <td data-campo="valor"></td>
        <td data-campo="tipo"></td>
        <td data-campo="data"></td>
    </tr>
</template>

<template id="tpl-dash-legenda-item">
    <div class="chart-legend-item">
        <span class="chart-legend-dot" data-campo="dot"></span>
        <span data-campo="texto"></span>
    </div>
</template>
