<div class="dash-topo">
    <h2 class="page-title">Visão Geral</h2>
    <div class="month-nav">
        <button class="btn-icon" id="dash-mes-prev" title="Mês anterior">
            <i class="pi pi-chevron-left"></i>
        </button>
        <span class="month-nav-label" id="dash-mes-label">—</span>
        <button class="btn-icon" id="dash-mes-next" title="Próximo mês">
            <i class="pi pi-chevron-right"></i>
        </button>
    </div>
</div>

<div class="summary-grid">
    <div class="summary-card">
        <div class="summary-icon summary-icon-primary">
            <i class="pi pi-wallet"></i>
        </div>
        <div class="summary-info">
            <span class="summary-label">Saldo em contas</span>
            <span class="summary-value" id="dash-saldo-contas">—</span>
        </div>
    </div>

    <div class="summary-card">
        <div class="summary-icon summary-icon-success">
            <i class="pi pi-arrow-down-left"></i>
        </div>
        <div class="summary-info">
            <span class="summary-label">Receitas do mês</span>
            <span class="summary-value" id="dash-receitas">—</span>
        </div>
    </div>

    <div class="summary-card">
        <div class="summary-icon summary-icon-danger">
            <i class="pi pi-arrow-up-right"></i>
        </div>
        <div class="summary-info">
            <span class="summary-label">Despesas do mês</span>
            <span class="summary-value" id="dash-despesas">—</span>
        </div>
    </div>

    <div class="summary-card">
        <div class="summary-icon summary-icon-info">
            <i class="pi pi-chart-line"></i>
        </div>
        <div class="summary-info">
            <span class="summary-label">Saldo do mês</span>
            <span class="summary-value" id="dash-saldo-mes">—</span>
        </div>
    </div>
</div>

<div class="dashboard-grid">
    <div class="card">
        <div class="card-header">
            <h2>Despesas por categoria</h2>
        </div>
        <div class="chart-area" id="dash-pizza-area">
            <div class="chart-pizza" id="dash-pizza"></div>
            <div class="chart-legend" id="dash-pizza-legend"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Receitas x Despesas</h2>
            <span class="chart-subtitle">Últimos 6 meses</span>
        </div>
        <div class="chart-area" id="dash-barras-area">
            <div class="chart-barras" id="dash-barras"></div>
            <div class="chart-legend chart-legend-inline">
                <div class="chart-legend-item">
                    <span class="chart-legend-dot" style="background: var(--color-green)"></span>
                    <span>Receitas</span>
                </div>
                <div class="chart-legend-item">
                    <span class="chart-legend-dot" style="background: var(--color-red)"></span>
                    <span>Despesas</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card dash-linha-card">
    <div class="card-header">
        <h2>Evolução do saldo</h2>
        <span class="chart-subtitle">Fluxo acumulado (últimos 6 meses)</span>
    </div>
    <div class="chart-area" id="dash-linha-area">
        <div class="chart-linha" id="dash-linha"></div>
    </div>
</div>

<template id="tpl-dash-vazio-grafico">
    <div class="empty-state">
        <i class="pi pi-chart-pie"></i>
        <p>Sem dados para exibir neste período</p>
    </div>
</template>
