<div class="stat-grid" id="investimentos-resumo">
    <div class="stat-card">
        <span class="stat-label">Total Aplicado</span>
        <span class="stat-value" id="resumo-aplicado">—</span>
    </div>

    <div class="stat-card">
        <span class="stat-label">Valor Atual</span>
        <span class="stat-value" id="resumo-atual">—</span>
    </div>

    <div class="stat-card">
        <span class="stat-label">Rendimento</span>
        <span class="stat-value" id="resumo-rendimento">—</span>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h2>Investimentos</h2>
        <button class="btn btn-primary" id="btn-novo-investimento">
            <i class="pi pi-plus"></i> Novo Investimento
        </button>
    </div>
    <div id="investimentos-body"></div>
</div>

<div class="modal-overlay hidden" id="modal-investimento">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-investimento-title">Novo Investimento</h3>
            <button class="btn-icon" id="modal-investimento-close">
                <i class="pi pi-times"></i>
            </button>
        </div>

        <form id="form-investimento">
            <input type="hidden" id="investimento-id" />

            <div class="form-group">
                <label>Nome</label>
                <input
                        type="text"
                        id="investimento-nome"
                        required
                        placeholder="Ex.: CDB Banco X"
                />
            </div>

            <div class="form-group">
                <label>Tipo</label>
                <select id="investimento-tipo">
                    <option value="CDB">CDB</option>
                    <option value="CDI">CDI</option>
                    <option value="TESOURO">Tesouro Direto</option>
                    <option value="POUPANCA">Poupança</option>
                    <option value="LCI_LCA">LCI / LCA</option>
                    <option value="ACOES">Ações</option>
                    <option value="FUNDOS">Fundos</option>
                    <option value="CRIPTO">Criptomoedas</option>
                    <option value="OURO">Ouro</option>
                    <option value="BET">Aposta (Bet)</option>
                    <option value="OUTRO">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label>Valor Aplicado</label>
                <input type="number" step="0.01" id="investimento-valorAplicado" required />
            </div>

            <div class="form-group" id="grupo-valorAtual">
                <label>Valor Atual</label>
                <input
                        type="number"
                        step="0.01"
                        id="investimento-valorAtual"
                />
                <small class="campo-ajuda">Deixe em branco para usar o valor aplicado.</small>
            </div>

            <div class="form-group hidden" id="grupo-resultado">
                <label>Resultado da Aposta</label>
                <select id="investimento-resultado">
                    <option value="PENDENTE">Pendente</option>
                    <option value="GANHOU">Ganhou</option>
                    <option value="PERDEU">Perdeu</option>
                </select>
                <small class="campo-ajuda">Se "Ganhou", informe o valor atual (retorno).</small>
            </div>

            <div class="form-group" id="grupo-status">
                <label>Status</label>
                <select id="investimento-status">
                    <option value="ATIVO">Ativo</option>
                    <option value="RESGATADO">Resgatado</option>
                </select>
            </div>

            <div class="form-group">
                <label>Instituição / Corretora</label>
                <input
                        type="text"
                        id="investimento-instituicao"
                        placeholder="Ex.: Nubank, XP..."
                />
            </div>

            <div class="form-group">
                <label>Taxa / Rentabilidade (%)</label>
                <input
                        type="number"
                        step="0.01"
                        id="investimento-taxa"
                        placeholder="Ex.: 12.5"
                />
            </div>

            <div class="form-group">
                <label>Data de Aplicação</label>
                <div class="custom-datepicker" id="inv-dataAplicacao-wrapper">
                    <input
                            type="text"
                            id="inv-dataAplicacao-display"
                            class="datepicker-input"
                            placeholder="Selecione a data"
                            readonly
                            required
                    />
                    <input
                            type="hidden"
                            id="inv-dataAplicacao"
                    />
                    <div class="datepicker-dropdown" id="inv-dataAplicacao-dropdown">
                        <div class="datepicker-header">
                            <button type="button" id="inv-dataAplicacao-prev">
                                <i class="pi pi-chevron-left"></i>
                            </button>
                            <button type="button" class="datepicker-title" id="inv-dataAplicacao-title">
                                <span id="inv-dataAplicacao-month-year"></span>
                                <i class="pi pi-chevron-down"></i>
                            </button>
                            <button type="button" id="inv-dataAplicacao-next">
                                <i class="pi pi-chevron-right"></i>
                            </button>
                        </div>
                        <div class="datepicker-weekdays">
                            <span>Dom</span>
                            <span>Seg</span>
                            <span>Ter</span>
                            <span>Qua</span>
                            <span>Qui</span>
                            <span>Sex</span>
                            <span>Sáb</span>
                        </div>
                        <div class="datepicker-days" id="inv-dataAplicacao-days"></div>
                        <div class="datepicker-years" id="inv-dataAplicacao-years"></div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Data de Vencimento (opcional)</label>
                <div class="custom-datepicker" id="inv-dataVencimento-wrapper">
                    <input
                            type="text"
                            id="inv-dataVencimento-display"
                            class="datepicker-input"
                            placeholder="Selecione a data"
                            readonly
                    />
                    <input
                            type="hidden"
                            id="inv-dataVencimento"
                    />
                    <div class="datepicker-dropdown" id="inv-dataVencimento-dropdown">
                        <div class="datepicker-header">
                            <button type="button" id="inv-dataVencimento-prev">
                                <i class="pi pi-chevron-left"></i>
                            </button>
                            <button type="button" class="datepicker-title" id="inv-dataVencimento-title">
                                <span id="inv-dataVencimento-month-year"></span>
                                <i class="pi pi-chevron-down"></i>
                            </button>
                            <button type="button" id="inv-dataVencimento-next">
                                <i class="pi pi-chevron-right"></i>
                            </button>
                        </div>
                        <div class="datepicker-weekdays">
                            <span>Dom</span>
                            <span>Seg</span>
                            <span>Ter</span>
                            <span>Qua</span>
                            <span>Qui</span>
                            <span>Sex</span>
                            <span>Sáb</span>
                        </div>
                        <div class="datepicker-days" id="inv-dataVencimento-days"></div>
                        <div class="datepicker-years" id="inv-dataVencimento-years"></div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="modal-investimento-cancel">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<template id="tpl-investimentos-vazio">
    <div class="empty-state">
        <i class="pi pi-chart-line"></i>
        <p>Nenhum investimento cadastrado</p>
    </div>
</template>

<template id="tpl-investimentos-tabela">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Aplicado</th>
                    <th>Atual</th>
                    <th>Rendimento</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="investimentos-tbody"></tbody>
        </table>
    </div>
</template>

<template id="tpl-investimentos-linha">
    <tr>
        <td data-campo="nome"></td>
        <td data-campo="tipo"></td>
        <td data-campo="aplicado"></td>
        <td data-campo="atual"></td>
        <td data-campo="rendimento"></td>
        <td data-campo="status"></td>
        <td data-campo="acoes"></td>
    </tr>
</template>
