<div class="auth-container">
    <div class="auth-card">
        <h1>
            <i class="pi pi-dollar"></i> Money Tracker
        </h1>
        <p class="subtitle">Faça login para continuar</p>
        <form id="login-form">
            <div class="form-group">
                <label>E-mail</label>

                <input 
                    type="email" 
                    id="login-email" 
                    required 
                    placeholder="seu@email.com" 
                />
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input 
                    type="password" 
                    id="login-senha" 
                    required 
                    placeholder="••••••••" 
                />
            </div>

            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>
        <p style="text-align: center; margin-top: 1rem;">
            <span class="link" data-navigate="#/register">Não tem conta? Cadastre-se</span>
        </p>
    </div>
</div>
