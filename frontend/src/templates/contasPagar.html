<h2 class="page-title">Contas a Pagar / Receber</h2>

<div id="cp-resumo"></div>

<div class="card">
    <div class="card-header">
        <h2>Compromissos</h2>
        <button class="btn btn-primary" id="btn-novo-cp">
            <i class="pi pi-plus"></i> Novo Compromisso
        </button>
    </div>
    <div id="cp-body"></div>
</div>

<div class="modal-overlay hidden" id="modal-cp">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-cp-title">Novo Compromisso</h3>
            <button class="btn btn-outline" id="modal-cp-close">
                <i class="pi pi-times"></i>
            </button>
        </div>
        <form id="form-cp">
            <input type="hidden" id="cp-id" />
            <div class="form-group">
                <label>Descrição</label>
                <input
                        type="text"
                        id="cp-descricao"
                        required
                        placeholder="Ex: Conta de luz"
                />
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="cp-tipo">
                    <option value="PAGAR">A pagar</option>
                    <option value="RECEBER">A receber</option>
                </select>
            </div>
            <div class="form-group">
                <label>Valor</label>
                <input
                        type="number"
                        step="0.01"
                        id="cp-valor"
                        required
                />
            </div>
            <div class="form-group">
                <label>Vencimento</label>
                <div id="cp-data-container"></div>
            </div>
            <div class="form-group">
                <label>Conta (opcional)</label>
                <select id="cp-conta">
                    <option value="">Nenhuma (apenas lembrete)</option>
                </select>
                <small class="campo-ajuda">Ao marcar como pago, o valor sai/entra no saldo dela.</small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="modal-cp-cancel">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<template id="tpl-cp-resumo">
    <div class="summary-grid">
        <div class="summary-card">
            <div class="summary-icon summary-icon-danger"><i class="pi pi-arrow-up-right"></i></div>
            <div class="summary-info">
                <span class="summary-label">A pagar (pendente)</span>
                <span class="summary-value" data-campo="total-pagar"></span>
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-icon summary-icon-success"><i class="pi pi-arrow-down-left"></i></div>
            <div class="summary-info">
                <span class="summary-label">A receber (pendente)</span>
                <span class="summary-value" data-campo="total-receber"></span>
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-icon summary-icon-info"><i class="pi pi-clock"></i></div>
            <div class="summary-info">
                <span class="summary-label">Vencidas (pendentes)</span>
                <span class="summary-value" data-campo="total-vencidas"></span>
            </div>
        </div>
    </div>
</template>

<template id="tpl-cp-vazio">
    <div class="empty-state">
        <i class="pi pi-calendar-clock"></i>
        <p>Nenhum compromisso cadastrado</p>
    </div>
</template>

<template id="tpl-cp-tabela">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Tipo</th>
                    <th>Valor</th>
                    <th>Vencimento</th>
                    <th>Conta</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="cp-tbody"></tbody>
        </table>
    </div>
</template>

<template id="tpl-cp-linha">
    <tr>
        <td data-campo="descricao"></td>
        <td data-campo="tipo"></td>
        <td data-campo="valor"></td>
        <td data-campo="vencimento"></td>
        <td data-campo="conta"></td>
        <td data-campo="status"></td>
        <td data-campo="acoes"></td>
    </tr>
</template>
