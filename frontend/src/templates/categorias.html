<div class="card">
    <div class="card-header">
        <h2>Categorias</h2>
        <button class="btn btn-primary" id="btn-nova-categoria">
            <i class="pi pi-plus"></i> Nova Categoria
        </button>
    </div>
    <div id="categorias-body"></div>
</div>

<div class="modal-overlay hidden" id="modal-categoria">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-categoria-title">Nova Categoria</h3>
            <button class="btn btn-outline" id="modal-categoria-close">
                <i class="pi pi-times"></i>
            </button>
        </div>

        <form id="form-categoria">
            <input type="hidden" id="categoria-id" />
            <div class="form-group">
                <label>Nome</label>
                <input 
                    type="text" 
                    id="categoria-nome" 
                    required 
                />
            </div>

            <div class="form-group">
                <label>Tipo</label>
                <select id="categoria-tipo">
                    <option value="DESPESA">Despesa</option>
                    <option value="RECEITA">Receita</option>
                </select>
            </div>

            <div class="form-group">
                <label>Cor</label>
                <input 
                    type="color" 
                    id="categoria-cor" 
                    value="#6366f1"
                />
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="modal-categoria-cancel">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<template id="tpl-categorias-vazio">
    <div class="empty-state">
        <i class="pi pi-tag"></i>
        <p>Nenhuma categoria cadastrada</p>
    </div>
</template>

<template id="tpl-categorias-tabela">
    <div class="table-container">
        <table>
            <thead>
                <tr><th>Cor</th><th>Nome</th><th>Tipo</th><th></th></tr>
            </thead>
            <tbody id="categorias-tbody"></tbody>
        </table>
    </div>
</template>

<template id="tpl-categorias-linha">
    <tr>
        <td data-campo="cor"></td>
        <td data-campo="nome"></td>
        <td data-campo="tipo"></td>
        <td data-campo="acoes"></td>
    </tr>
</template>
