<div class="auth-container">
    <div class="auth-card">
        <h1>
            <i class="pi pi-dollar"></i> Money Tracker
        </h1>
        <p class="subtitle">Crie sua conta</p>
        <form id="register-form">
            <div class="form-group">
                <label>Nome</label>
                <input 
                    type="text" 
                    id="register-nome" 
                    required 
                    placeholder="Seu nome" 
                />
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input 
                    type="email" 
                    id="register-email" 
                    required 
                    placeholder="seu@email.com" 
                />
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input 
                    type="password" 
                    id="register-senha" 
                    required 
                    placeholder="••••••••" 
                />
            </div>
            <div class="form-group">
                <label>Moeda Preferida</label>
                <select id="register-moeda">
                    <option value="BRL">🇧🇷 Real (BRL)</option>
                    <option value="USD">🇺🇸 Dólar (USD)</option>
                    <option value="EUR">🇪🇺 Euro (EUR)</option>
                    <option value="GBP">🇬🇧 Libra (GBP)</option>
                    <option value="ARS">🇦🇷 Peso Argentino (ARS)</option>
                    <option value="JPY">🇯🇵 Iene (JPY)</option>
                    <option value="CAD">🇨🇦 Dólar Canadense (CAD)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
        </form>
        <p style="text-align: center; margin-top: 1rem;">
            <span class="link" data-navigate="#/login">Já tem conta? Faça login</span>
        </p>
    </div>
</div>
