<div class="auth-container">
    <div class="auth-card">
        <h1>
            <i class="pi pi-dollar"></i> Money Tracker
        </h1>
        <p class="subtitle">Crie sua conta</p>
        <form id="register-form">
            <div class="form-group">
                <label>Nome</label>
                <input 
                        type="text"
                        id="register-nome"
                        required
                        placeholder="Seu nome"
                />
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input 
                        type="email"
                        id="register-email"
                        required
                        placeholder="seu@email.com"
                />
            </div>
            <div class="form-group">
                <label>Senha</label>
                <div class="password-field">
                    <input
                            type="password"
                            id="register-senha"
                            required
                            placeholder="••••••••"
                    />
                    <button type="button" class="password-toggle" data-target="register-senha" aria-label="Mostrar senha">
                        <i class="pi pi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Moeda Preferida</label>
                <div class="custom-select" id="register-moeda-wrapper">
                    <button type="button" class="custom-select-toggle" id="register-moeda-toggle">
                        <span id="register-moeda-label">🇧🇷 Real (BRL)</span>
                        <i class="pi pi-chevron-down custom-select-arrow"></i>
                    </button>
                    <div class="custom-select-options" id="register-moeda-options">
                        <div class="custom-select-option selected" data-value="BRL">🇧🇷 Real (BRL)</div>
                        <div class="custom-select-option" data-value="USD">🇺🇸 Dólar (USD)</div>
                        <div class="custom-select-option" data-value="EUR">🇪🇺 Euro (EUR)</div>
                        <div class="custom-select-option" data-value="GBP">🇬🇧 Libra (GBP)</div>
                        <div class="custom-select-option" data-value="ARS">🇦🇷 Peso Argentino (ARS)</div>
                        <div class="custom-select-option" data-value="JPY">🇯🇵 Iene (JPY)</div>
                        <div class="custom-select-option" data-value="CAD">🇨🇦 Dólar Canadense (CAD)</div>
                    </div>
                </div>
                <input type="hidden" id="register-moeda" value="BRL" />
            </div>
            <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
        </form>
        <p style="text-align: center; margin-top: 1rem;">
            <span class="link" data-navigate="#/login">Já tem conta? Faça login</span>
        </p>
    </div>
</div>
