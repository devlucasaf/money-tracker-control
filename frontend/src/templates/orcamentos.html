<div class="card">
    <div class="card-header">
        <h2>Orçamentos</h2>
        <button class="btn btn-primary" id="btn-novo-orcamento"><i class="pi pi-plus"></i> Novo Orçamento</button>
    </div>
    <div id="orcamentos-body"></div>
</div>

<div class="modal-overlay hidden" id="modal-orcamento">
    <div class="modal">
        <div class="modal-header">
            <h3>Novo Orçamento</h3>
            <button class="btn btn-outline" id="modal-orcamento-close"><i class="pi pi-times"></i></button>
        </div>
        <form id="form-orcamento">
            <div class="form-group">
                <label>Categoria</label>
                <select id="orcamento-categoria" required><option value="">Selecione...</option></select>
            </div>
            <div class="form-group">
                <label>Valor Limite</label>
                <input type="number" step="0.01" id="orcamento-valorLimite" required />
            </div>
            <div class="form-group">
                <label>Mês/Ano</label>
                <input type="month" id="orcamento-mesAno" required />
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="modal-orcamento-cancel">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<!-- Templates -->
<template id="tpl-orcamentos-vazio">
    <div class="empty-state">
        <i class="pi pi-chart-pie"></i>
        <p>Nenhum orçamento cadastrado</p>
    </div>
</template>

<template id="tpl-orcamentos-tabela">
    <div class="table-container">
        <table>
            <thead>
                <tr><th>Categoria</th><th>Limite</th><th>Gasto</th><th>Disponível</th><th>Mês/Ano</th><th></th></tr>
            </thead>
            <tbody id="orcamentos-tbody"></tbody>
        </table>
    </div>
</template>

<template id="tpl-orcamentos-linha">
    <tr>
        <td data-campo="categoria"></td>
        <td data-campo="limite"></td>
        <td data-campo="gasto">
            <div class="progress-bar" style="margin-bottom:4px">
                <div class="fill" data-campo="fill"></div>
            </div>
            <small data-campo="gasto-texto"></small>
        </td>
        <td data-campo="disponivel"></td>
        <td data-campo="mesAno"></td>
        <td data-campo="acoes"></td>
    </tr>
</template>
