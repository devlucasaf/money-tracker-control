<div class="card">
    <div class="card-header">
        <h2>Contas</h2>
        <button class="btn btn-primary" id="btn-nova-conta"><i class="pi pi-plus"></i> Nova Conta</button>
    </div>
    <div id="contas-body"></div>
</div>

<div class="modal-overlay hidden" id="modal-conta">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-conta-title">Nova Conta</h3>
            <button class="btn btn-outline" id="modal-conta-close"><i class="pi pi-times"></i></button>
        </div>
        <form id="form-conta">
            <input type="hidden" id="conta-id" />
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="conta-nome" required />
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="conta-tipo">
                    <option value="CORRENTE">Corrente</option>
                    <option value="POUPANCA">Poupança</option>
                    <option value="INVESTIMENTO">Investimento</option>
                    <option value="CARTEIRA">Carteira</option>
                </select>
            </div>
            <div class="form-group">
                <label>Saldo Inicial</label>
                <input type="number" step="0.01" id="conta-saldo" required />
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="modal-conta-cancel">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<!-- Templates -->
<template id="tpl-contas-vazio">
    <div class="empty-state">
        <i class="pi pi-wallet"></i>
        <p>Nenhuma conta cadastrada</p>
    </div>
</template>

<template id="tpl-contas-tabela">
    <div class="table-container">
        <table>
            <thead>
                <tr><th>Nome</th><th>Tipo</th><th>Saldo</th><th></th></tr>
            </thead>
            <tbody id="contas-tbody"></tbody>
        </table>
    </div>
</template>

<template id="tpl-contas-linha">
    <tr>
        <td data-campo="nome"></td>
        <td data-campo="tipo"></td>
        <td data-campo="saldo"></td>
        <td data-campo="acoes"></td>
    </tr>
</template>
